[build]
  command = "npm install"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    enabled = false

[dev]
  command = "npm run start"
  port = 3000
  targetPort = 3000
  publish = "public"
  autoLaunch = true
